<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060b16" />
    <meta name="description" content="Deep Education — a digital classroom for Computer Application and Computer Science students." />
    <title>Deep Education | Learn. Practice. Excel.</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Netlify Badge Hide Script -->
    <script>
      const removeNetlifyBadge = () => {
        const badge = document.querySelector('iframe[src*="netlify"]') || 
                      document.getElementById('netlify-badge') || 
                      document.querySelector('[data-netlify-badge]');
        if (badge) badge.remove();
      };
      
      removeNetlifyBadge();
      
      const observer = new MutationObserver(() => {
        removeNetlifyBadge();
      });
      
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
